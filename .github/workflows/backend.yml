name: Backend CI

on:
  push:
    paths:
      - "backend/Spring/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/Spring/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Spring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Compile and test
        run: mvn clean verify -B
