<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>差旅费用报销单</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- 单据头部（固定） -->
  <header class="doc-header">
    <h1 class="doc-title">差旅费用报销单</h1>
    <div class="doc-date">提交日期 <span id="submitDate">2026-04-23</span></div>
  </header>

  <main class="doc-main">
    <!-- 基础信息 -->
    <section class="panel" id="panel-basic">
      <div class="panel-header" data-toggle="basic">
        <span class="panel-bar"></span>
        <h2 class="panel-title">基础信息</h2>
        <span class="panel-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
        </span>
      </div>
      <div class="panel-body" id="basic-body"></div>
    </section>

    <!-- 补录行程 -->
    <section class="panel" id="panel-trip">
      <div class="panel-header" data-toggle="trip">
        <span class="panel-bar"></span>
        <h2 class="panel-title">补录行程</h2>
        <div class="panel-extra">
          <button class="btn-text" id="btnAddTrip">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
            补录行程
          </button>
          <span class="panel-toggle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
          </span>
        </div>
      </div>
      <div class="panel-body" id="trip-body"></div>
    </section>

    <!-- 补助信息 -->
    <section class="panel" id="panel-subsidy">
      <div class="panel-header" data-toggle="subsidy">
        <span class="panel-bar"></span>
        <h2 class="panel-title" id="subsidyTitle">补助信息 <span class="title-sub">0.00</span> <span class="title-tip" id="subsidyTip">(徐年年5天)</span></h2>
        <span class="panel-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
        </span>
      </div>
      <div class="panel-body" id="subsidy-body"></div>
    </section>

    <!-- 费用合计 -->
    <section class="panel" id="panel-total">
      <div class="panel-header" data-toggle="total">
        <span class="panel-bar"></span>
        <h2 class="panel-title">费用合计</h2>
        <span class="panel-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
        </span>
      </div>
      <div class="panel-body" id="total-body"></div>
    </section>

    <!-- 费用归属及分摊 -->
    <section class="panel" id="panel-allocation">
      <div class="panel-header" data-toggle="allocation">
        <span class="panel-bar"></span>
        <h2 class="panel-title">费用归属及分摊<span class="title-tip">（分摊金额: <span id="allocTotal">0.00</span>）</span></h2>
        <span class="panel-toggle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
        </span>
      </div>
      <div class="panel-body" id="allocation-body"></div>
    </section>

    <!-- 备注信息 -->
    <section class="panel" id="panel-remark">
      <div class="panel-header" data-toggle="remark">
        <span class="panel-bar"></span>
        <h2 class="panel-title">备注信息</h2>
        <div class="panel-extra">
          <button class="btn-text" id="btnDeleteRemark">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            删除备注
          </button>
          <span class="panel-toggle">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
          </span>
        </div>
      </div>
      <div class="panel-body" id="remark-body"></div>
    </section>
  </main>

  <!-- 底部按钮（固定） -->
  <footer class="doc-footer">
    <button class="btn btn-default" id="btnClose">关闭</button>
    <button class="btn btn-primary" id="btnSubmit">提交</button>
  </footer>

  <!-- 弹窗挂载点 -->
  <div id="modalRoot"></div>

  <!-- Scripts -->
  <script src="js/mock.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/modals/confirm.js"></script>
  <script src="js/modals/tripModal.js"></script>
  <script src="js/modals/subsidyModal.js"></script>
  <script src="js/sections/basicInfo.js"></script>
  <script src="js/sections/trip.js"></script>
  <script src="js/sections/subsidy.js"></script>
  <script src="js/sections/total.js"></script>
  <script src="js/sections/allocation.js"></script>
  <script src="js/sections/remark.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
